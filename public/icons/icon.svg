<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4" />
  
  <!-- Stylized Label Tag / QR symbol -->
  <g filter="url(#glow)" transform="translate(106, 106)">
    <!-- QR Corner Top Left -->
    <rect x="20" y="20" width="80" height="80" rx="16" fill="white" />
    <rect x="36" y="36" width="48" height="48" rx="8" fill="#4f46e5" />
    <rect x="48" y="48" width="24" height="24" rx="4" fill="white" />

    <!-- QR Corner Top Right -->
    <rect x="200" y="20" width="80" height="80" rx="16" fill="white" />
    <rect x="216" y="36" width="48" height="48" rx="8" fill="#4f46e5" />
    <rect x="228" y="48" width="24" height="24" rx="4" fill="white" />

    <!-- QR Corner Bottom Left -->
    <rect x="20" y="200" width="80" height="80" rx="16" fill="white" />
    <rect x="36" y="216" width="48" height="48" rx="8" fill="#4f46e5" />
    <rect x="48" y="228" width="24" height="24" rx="4" fill="white" />

    <!-- Center & Bottom Right Pattern Nodes -->
    <rect x="130" y="30" width="40" height="40" rx="8" fill="white" opacity="0.9" />
    <rect x="130" y="90" width="40" height="40" rx="8" fill="white" />
    <rect x="30" y="130" width="40" height="40" rx="8" fill="white" />
    <rect x="90" y="130" width="40" height="40" rx="8" fill="white" opacity="0.9" />
    <rect x="150" y="150" width="60" height="60" rx="12" fill="#38bdf8" />
    <rect x="220" y="140" width="50" height="50" rx="10" fill="white" opacity="0.9" />
    <rect x="130" y="230" width="40" height="40" rx="8" fill="white" />
    <rect x="190" y="210" width="40" height="40" rx="8" fill="white" />
    <rect x="240" y="240" width="40" height="40" rx="8" fill="white" />
  </g>

  <!-- Laser Scan Line -->
  <line x1="80" y1="256" x2="432" y2="256" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="drop-shadow(0 0 8px #38bdf8)" />
</svg>
